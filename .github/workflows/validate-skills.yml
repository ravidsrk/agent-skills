name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills against agentskills.io spec
        run: python3 scripts/validate-skills.py
      - name: Test Finish Line native protocol guards
        run: python3 -m unittest discover -s skills/finish-line/tests -v
