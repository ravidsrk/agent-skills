name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills against agentskills.io spec
        run: python3 scripts/validate-skills.py
      - name: Check relative Markdown links
        run: python3 scripts/check-links.py
      - name: Lint Python and parse every shell script
        run: |
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes $(git ls-files '*.py')
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Test Finish Line native protocol guards
        run: python3 -m unittest discover -s skills/finish-line/tests -v
